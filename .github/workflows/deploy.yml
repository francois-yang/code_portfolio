name: Build and Deploy to VPS

on:
    push:
        branches: [master]

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: |
                  npm install astro@7.2.9 @astrojs/node@11.1.4
                  npm run build
                  cp package.json dist/server/
            - name: Deploy to VPS via SCP
              uses: appleboy/scp-action@v0.1.3
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: 22042
                  source: "dist/*"
                  target: "/var/www/portfolio/"
                  strip_components: 1
                  rm: false
                  overwrite: true
                  debug: true
            - name: Install production dependencies on VPS
              uses: appleboy/ssh-action@v1.0.0
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: 22042
                  script: |
                      cd /var/www/portfolio/server
                      npm install
                      npm install astro@7.2.9 @astrojs/node@11.1.4
                      PORT=8051 pm2 restart etudiant || PORT=8051 pm2 start entry.mjs --name etudiant
